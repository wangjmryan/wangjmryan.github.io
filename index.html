<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ryan Wang</title>
  <meta name="description" content="First-year Systems Design Engineering student at the University of Waterloo, looking for a hardware or embedded co-op for Summer 2027.">

  <!-- Link previews. Bots that read these don't run JavaScript, so they're
       written out here by hand. og:url and og:image must be full URLs. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Ryan Wang">
  <meta property="og:description" content="Systems Design Engineering at Waterloo. Looking for a hardware / embedded co-op, Summer 2027.">
  <meta property="og:url" content="https://wangjmryan.github.io/">
  <meta property="og:image" content="https://wangjmryan.github.io/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="canonical" href="https://wangjmryan.github.io/">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FAFAF8">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <!-- The two faces in the first screen (bio text and the name). -->
  <link rel="preload" href="fonts/literata-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/literata-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">

  <!-- Apply a saved light/dark choice before the page paints (no flash). -->
  <script>
    try {
      var t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <script src="data.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="page">
    <!-- Left column on wide screens (stays put while the right side scrolls);
         the top of the page on phones. -->
    <header class="intro">
      <h1 class="name"><a href="#" data-home>Ryan Wang</a></h1>
      <div class="bio" data-bio></div>
      <!-- Without JavaScript the lists can't be built, so at least say who this is
           and how to reach him. Keep in step with data.js if these change. -->
      <noscript>
        <div class="noscript">
          <p>I'm Ryan Wang, a first-year Systems Design Engineering student at the University of Waterloo, looking for a hardware or embedded co-op for Summer 2027.</p>
          <p><a href="assets/resume.pdf">résumé (PDF)</a> · <a href="mailto:wangjmryan@gmail.com">email</a> · <a href="https://www.linkedin.com/in/wjmryan">linkedin</a> · <a href="https://github.com/wangjmryan">github</a></p>
        </div>
      </noscript>
      <nav class="links" aria-label="Résumé and contact">
        <ul data-links></ul>
        <button class="theme-toggle" type="button" aria-pressed="false">
          <!-- Sun (light mode) that morphs into a moon (dark mode); see style.css. -->
          <svg class="theme-icon" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <circle class="sun" cx="10" cy="10" r="3.5"/>
            <path class="rays" d="M10 1.5v2.2M10 16.3v2.2M1.5 10h2.2M16.3 10h2.2M4 4l1.6 1.6M14.4 14.4 16 16M4 16l1.6-1.6M14.4 5.6 16 4"/>
            <path class="moon" pathLength="1" d="M16.5 12.6A7 7 0 0 1 7.4 3.5a7 7 0 1 0 9.1 9.1Z"/>
          </svg>
          <span class="sr-only">Dark mode</span>
        </button>
      </nav>
    </header>

    <main id="main" tabindex="-1">
      <div id="home-view">
        <section class="group" aria-labelledby="building-title">
          <h2 class="group-title" id="building-title">building</h2>
          <ul class="items" data-builds></ul>
        </section>

        <section class="group" aria-labelledby="teams-title" data-teams-section>
          <h2 class="group-title" id="teams-title">teams</h2>
          <ul class="items" data-teams></ul>
        </section>

        <section class="group" aria-labelledby="software-title" data-software-section hidden>
          <h2 class="group-title" id="software-title">software</h2>
          <ul class="items" data-software></ul>
        </section>
      </div>

      <!-- A build's own page, shown instead of the list at #build/<slug>. -->
      <article id="detail-view" hidden></article>

      <footer class="foot"><p data-updated></p></footer>
    </main>
  </div>

</body>
</html>
